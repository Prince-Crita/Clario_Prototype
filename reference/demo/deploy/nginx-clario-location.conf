# Add inside the existing server { ... } block for server.crita.in
# (HTTP and/or HTTPS — same location in both if you have two server blocks)

# Clario app at https://server.crita.in/clario/
location = /clario {
    return 301 /clario/;
}

location /clario/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /clario;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
